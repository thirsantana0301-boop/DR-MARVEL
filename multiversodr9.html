<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#0e0819">
<title>Multiverso DR</title>
<style>
@property --ink{syntax:'<color>';inherits:true;initial-value:#0e0819}
@property --ink2{syntax:'<color>';inherits:true;initial-value:#1a1030}
@property --ink3{syntax:'<color>';inherits:true;initial-value:#241546}
@property --blue{syntax:'<color>';inherits:true;initial-value:#5b21b6}
@property --red{syntax:'<color>';inherits:true;initial-value:#e11d3f}
@property --gold{syntax:'<color>';inherits:true;initial-value:#c9a7ff}
@property --bd{syntax:'<color>';inherits:true;initial-value:#3b2568}
@property --g1{syntax:'<color>';inherits:true;initial-value:#3a1470}
@property --g2{syntax:'<color>';inherits:true;initial-value:#5a0f3a66}
:root{color-scheme:dark;--disp:"Trebuchet MS","Segoe UI","Helvetica Neue",Arial,sans-serif;--fd:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--ink:#0e0819;--ink2:#1a1030;--ink3:#241546;--blue:#5b21b6;--red:#e11d3f;--gold:#c9a7ff;--g1:#3a1470;--g2:#5a0f3a66;--pos:#ffcf5a;--neg:#ff4d6d;--paper:#f1e9fb;--pt:#1a0f2b;--fg:#f1ecfa;--mut:#a99bc9;--bd:#3b2568;transition:--ink 2.5s,--ink2 2.5s,--ink3 2.5s,--blue 2.5s,--red 2.5s,--gold 2.5s,--bd 2.5s,--g1 2.5s,--g2 2.5s}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% -8%,var(--g1) 0,transparent 45%),radial-gradient(circle at 100% 8%,var(--g2) 0,transparent 40%),var(--ink);min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 38%,transparent 52%,#000000a6 100%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#flash{position:fixed;inset:0;background:#dbe7ff;opacity:0;pointer-events:none;z-index:15}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle,#ffffff12 1.2px,transparent 1.6px) 0 0/14px 14px;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(104px + env(safe-area-inset-bottom,0px))}
.logo{font:800 46px/.95 var(--fd);letter-spacing:1px;transform:none;margin:10px 0 4px;color:var(--fg);text-shadow:2px 2px 0 var(--red)}
.logo b{color:var(--gold);font-weight:600}
.tag{color:var(--mut);margin:6px 0 18px}
h2{font:700 22px/1.1 var(--fd);letter-spacing:.5px;margin:0 0 8px;transform:none}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px;color:var(--gold)}
input,textarea,select{width:100%;padding:12px;border:2px solid var(--bd);border-radius:8px;background:var(--ink2);color:var(--fg);font:16px system-ui,sans-serif}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px}.row>div{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.era{border:2px solid var(--bd);background:var(--ink2);color:var(--fg);cursor:pointer;font:600 14px system-ui,sans-serif;padding:9px 13px;border-radius:8px;text-align:left}
.chip.on,.era.on{background:var(--blue);border-color:var(--gold);box-shadow:3px 3px 0 var(--red)}
.big{width:100%;margin-top:24px;padding:15px;border:3px solid #000;border-radius:8px;background:var(--red);color:#fff;font:700 19px var(--fd);letter-spacing:1px;cursor:pointer;box-shadow:5px 5px 0 var(--gold)}
.big:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--gold)}
.big.say{background:var(--blue)}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--ink2);border:2px solid var(--bd);border-radius:8px;padding:12px 14px;margin:10px 0}
.step i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#000;font:700 15px/28px var(--fd);text-align:center;font-style:normal}
a{color:var(--gold)}
.note{color:var(--mut);font-size:13px;margin-top:4px}
.mini{padding:8px 12px;border:2px solid var(--bd);border-radius:8px;background:var(--ink2);color:var(--mut);font:600 12px system-ui,sans-serif;cursor:pointer}
.pill{display:inline-block;padding:3px 11px;border:2px solid var(--bd);border-radius:999px;background:var(--ink2);font:600 13px system-ui,sans-serif;color:var(--gold)}
.hero{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
.hero-t{flex:1;min-width:0}.hero h2{margin:0;font-size:25px}
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;border:3px solid #000;border-radius:50%;font-family:var(--fd);font-weight:600;color:#fff;box-shadow:2px 2px 0 #000;text-shadow:1px 1px 0 #0008}
.menu{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin:8px 0 12px;padding:12px;border:2px dashed var(--bd);border-radius:10px;background:#ffffff08}
.menu .awrow{flex-basis:100%}.menu .awrow label{margin-top:2px}
.meter{margin:14px 0;padding:10px 12px;border:2px solid var(--bd);border-radius:8px;background:var(--ink2)}
.meter .top{display:flex;justify-content:space-between;font:600 14px system-ui,sans-serif;margin-bottom:7px}
.track{height:12px;border:2px solid #000;border-radius:3px;background:#000;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .6s}
details{margin:10px 0;border:2px solid var(--bd);border-radius:8px;padding:10px 14px;background:var(--ink2);font-size:14px}
summary{cursor:pointer;font-weight:600}
details li{margin:6px 0;color:var(--mut)}
.turn{margin:0 0 24px}
.turn.fresh{animation:up .4s ease-out}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.me{margin:0 0 10px auto;max-width:85%;background:var(--blue);border:2px solid #000;border-radius:16px 16px 2px 16px;padding:8px 13px;font-size:14px;box-shadow:3px 3px 0 #000}
.nar{background:var(--paper);color:var(--pt);border:3px solid #000;box-shadow:6px 6px 0 var(--red);padding:14px 16px;margin:0 0 14px;font:17px/1.65 Georgia,"Times New Roman",serif}
.nar p{margin:0 0 11px}.nar p:last-child{margin:0}
.choice{display:block;width:100%;text-align:left;margin:9px 0;padding:12px 14px;border:2px solid var(--bd);border-left:6px solid var(--gold);border-radius:8px;background:var(--ink2);color:var(--fg);font:15px/1.4 system-ui,sans-serif;cursor:pointer}
.choice.say{border-left-color:var(--red)}
.choice:hover,.choice:active{background:var(--blue)}
.load{margin:12px 0;color:var(--gold);font:italic 700 15px system-ui,sans-serif;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.35}}
.bal{position:relative;max-width:84%;margin:20px 0 22px;padding:12px 16px;background:#fff;color:#111;border:3px solid #000;border-radius:22px;font:500 16px/1.5 "Comic Sans MS","Chalkboard SE",system-ui,sans-serif;box-shadow:4px 4px 0 var(--red)}
.bal::after{content:"";position:absolute;left:28px;bottom:-11px;width:16px;height:16px;background:#fff;border-right:3px solid #000;border-bottom:3px solid #000;transform:rotate(45deg)}
.bal .who{position:absolute;top:-14px;left:14px;background:var(--red);color:#fff;border:2px solid #000;padding:1px 9px;font:700 14px var(--fd);letter-spacing:.2px;transform:none}
.bal.r{margin-left:auto;background:var(--blue);color:#fff;box-shadow:-4px 4px 0 #000}
.bal.r::after{left:auto;right:30px;background:var(--blue)}
.bal.r .who{left:auto;right:14px;background:var(--gold);color:#000}
.bal.unk .who{background:#444}
.where{display:flex;align-items:center;gap:12px;margin:10px 0;padding:10px 16px;border:3px solid #000;background:linear-gradient(90deg,var(--blue),#2a0f4f);box-shadow:5px 5px 0 var(--red)}
.where .pin{font-size:26px}.where small{display:block;color:var(--gold);font:600 12px system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase}
.where b{font:700 20px/1.1 var(--fd);letter-spacing:.5px}
.locb{display:inline-block;background:var(--red);color:#fff;border:2px solid #000;padding:3px 12px;margin:0 0 12px;font:700 13px var(--fd);letter-spacing:.5px;transform:none}
.sys{text-align:center;color:var(--gold);font:600 14px system-ui,sans-serif;margin:0 0 12px}
.rlog{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.rchip{padding:4px 10px;border:2px solid var(--bd);border-radius:999px;background:var(--ink2);color:var(--pos);font:600 13px system-ui,sans-serif}
.newc{border:3px dashed var(--gold);border-radius:10px;background:var(--ink2);padding:14px 16px;margin:16px 0;box-shadow:5px 5px 0 var(--red)}
.newc .t{font:700 24px var(--fd);color:var(--gold);transform:none}
.newc p{margin:6px 0 0;color:var(--mut);font-style:italic}
.err{border:2px solid var(--red);background:#2a0d12;border-radius:8px;padding:11px 14px;margin:12px 0;font-size:14px}
.rest{text-align:center;border:3px solid var(--gold);border-radius:10px;background:var(--ink2);padding:18px 14px;margin:16px 0;box-shadow:5px 5px 0 var(--red)}
.rest .t{font:700 40px var(--fd);color:var(--gold);letter-spacing:1px}
.rest p{margin:6px 0 0;color:var(--mut);font-size:14px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;justify-content:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom,0px));background:#0e0819ee;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:3px solid #000;box-shadow:0 -3px 0 var(--red)}
.nav[hidden]{display:none}
.nav button{flex:1;max-width:320px;position:relative;padding:11px 8px;border:3px solid #000;border-radius:10px;background:var(--ink2);color:var(--mut);font:700 15px var(--fd);letter-spacing:.8px;cursor:pointer}
.nav button.on{background:var(--blue);color:#fff;box-shadow:3px 3px 0 var(--red)}
.nav .dot{position:absolute;top:-9px;right:-4px;min-width:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;border:2px solid #000;font:700 12px/18px system-ui,sans-serif}
.nav .dot[hidden]{display:none}
/* relações */
.sec h2{font-size:28px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.webc{border:3px solid #000;border-radius:12px;background:linear-gradient(180deg,#1f1238,#120a22);box-shadow:5px 5px 0 var(--red);padding:10px 10px 6px;margin:12px 0}
.webc .cap{display:flex;justify-content:space-between;gap:8px;font:600 12px system-ui,sans-serif;letter-spacing:1.5px;color:var(--gold)}
.web{width:100%;height:auto;display:block}
.web text{font:600 11px system-ui,sans-serif;fill:#f1ecfa;paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.web .nd{cursor:pointer}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:6px 0}
.filters .chip{white-space:nowrap}
.empty{text-align:center;padding:28px 16px;border:3px dashed var(--bd);border-radius:12px;color:var(--mut);margin:14px 0}
.empty b{display:block;font:700 22px var(--fd);color:var(--gold);margin-bottom:6px}
.pc{margin:14px 0;border:3px solid #000;border-radius:12px;background:var(--ink2);box-shadow:5px 5px 0 var(--bd);overflow:hidden}
.pc.good{box-shadow:5px 5px 0 #b8892a}.pc.bad{box-shadow:5px 5px 0 var(--red)}
.pc-top{display:flex;gap:12px;align-items:center;width:100%;padding:12px;background:none;border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.pc-mid{flex:1;min-width:0}
.pc-name{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pc-name b{font:700 19px var(--fd);letter-spacing:.4px}
.pc-age{color:var(--mut);font-size:12px}
.pc-type{color:var(--gold);font:600 14px system-ui,sans-serif;margin:1px 0 7px}
.pc-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mb{height:8px;border-radius:4px;background:#000;overflow:hidden;position:relative}
.mb i{position:absolute;top:0;bottom:0;display:block}
.mb.mid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ffffff55}
.chev{flex:none;color:var(--mut);font-size:18px;transition:transform .2s}
.pc.open .chev{transform:rotate(180deg)}
.badge-new,.badge-forgot{font:600 11px system-ui,sans-serif;padding:2px 8px;border-radius:999px;letter-spacing:.5px}
.badge-new{background:var(--pos);color:#000}.badge-forgot{background:#555;color:#eee}
.pc-body{padding:6px 14px 16px;border-top:2px dashed var(--bd)}
.mrow{margin:14px 0 4px}
.mh{display:flex;justify-content:space-between;gap:8px;font:600 14px system-ui,sans-serif}
.mv{color:var(--gold);text-align:right}
.sl{position:relative;height:28px}
.ctrack{position:absolute;left:0;right:0;top:7px;height:14px;border:2px solid #000;border-radius:5px;background:#000;overflow:hidden}
.ctrack.mid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#ffffff55}
.cfill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#7c3aed,var(--gold))}
.cfill.pos{background:linear-gradient(90deg,#d99a1c,var(--pos))}.cfill.neg{background:linear-gradient(90deg,var(--neg),#a3122e)}
.sl input{position:absolute;inset:0;width:100%;height:28px;margin:0;padding:0;border:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.sl input::-webkit-slider-runnable-track{background:transparent;height:28px}
.sl input::-moz-range-track{background:transparent;height:28px}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:3px;border-radius:50%;background:var(--paper);border:3px solid #000;box-shadow:2px 2px 0 var(--red)}
.sl input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid #000;box-shadow:2px 2px 0 var(--red)}
.d{font-size:11px;font-weight:600}.d.up{color:var(--pos)}.d.dn{color:var(--neg)}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.know{list-style:none;margin:6px 0;padding:0}
.know li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;margin:6px 0;border:2px solid var(--bd);border-radius:8px;background:#ffffff08;font-size:14px;color:var(--fg)}
.know li.none{color:var(--mut);font-style:italic;border-style:dashed}
.x{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #000;background:var(--red);color:#fff;font:600 14px/1 system-ui,sans-serif;cursor:pointer}
.addk{display:flex;gap:8px}.addk button{flex:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.act{padding:10px;border:2px solid var(--bd);border-radius:8px;background:var(--ink3);color:var(--fg);font:600 14px/1.3 system-ui,sans-serif;cursor:pointer;text-align:left}
.act small{display:block;font-weight:400;color:var(--mut);margin-top:3px}
.act.danger{border-color:var(--red);color:#ffb3c0}
.act:active{transform:translateY(2px)}
/* desfazer */
.undo{display:flex;align-items:center;gap:12px;margin:8px 0 16px;padding:12px 14px;border:3px dashed var(--bd);border-radius:14px;background:linear-gradient(135deg,#ffffff0a,#ffffff04)}
.undo-ic{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid #000;background:var(--ink3);display:flex;align-items:center;justify-content:center;font:600 22px/1 system-ui,sans-serif;color:var(--gold);box-shadow:2px 2px 0 var(--red)}
.undo-t{flex:1;min-width:0;font-size:13px;line-height:1.4;color:var(--mut)}
.undo-t b{display:block;color:var(--fg);font:700 16px var(--fd);letter-spacing:.5px;margin-bottom:2px}
.undo-b{flex:none;padding:10px 14px;border:3px solid #000;border-radius:10px;background:var(--red);color:#fff;font:700 14px var(--fd);letter-spacing:.8px;cursor:pointer;box-shadow:3px 3px 0 var(--gold);transition:transform .1s,box-shadow .1s}
.undo-b:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--gold)}
/* atmosfera */
.atm{margin:0 0 12px;border:3px solid #000;border-radius:14px;background:linear-gradient(120deg,var(--ink3),var(--ink2));box-shadow:4px 4px 0 var(--bd);overflow:hidden}
.atm-top{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.atm-ic{flex:none;min-width:48px;height:48px;padding:0 8px;border-radius:14px;border:3px solid #000;background:radial-gradient(circle at 30% 25%,var(--g1),var(--ink));display:flex;align-items:center;justify-content:center;font-size:22px;letter-spacing:2px;box-shadow:2px 2px 0 #000}
.atm-tx{flex:1;min-width:0}.atm-tx small{display:block;color:var(--gold);font:600 12px system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase}
.atm-tx b{font:700 17px/1.2 var(--fd);letter-spacing:.5px}
.atm.open .chev{transform:rotate(180deg)}
.atm-b{padding:2px 14px 14px;border-top:2px dashed var(--bd)}
.atm-b input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--gold);height:30px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin:10px 0 0;padding:11px 14px;border:2px solid var(--bd);border-radius:10px;background:var(--ink2);color:var(--fg);font:600 14px system-ui,sans-serif;text-align:left;cursor:pointer}
.sw{flex:none;position:relative;width:46px;height:26px;border-radius:999px;background:#000;border:2px solid var(--bd)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:left .2s,background .2s}
.tg.on{border-color:var(--gold)}.tg.on .sw{background:var(--blue)}.tg.on .sw::after{left:22px;background:var(--paper)}
/* livro */
.bookstrip{display:flex;align-items:center;gap:12px;width:100%;margin:10px 0 18px;padding:11px 14px;border:3px solid #000;border-radius:12px;background:linear-gradient(90deg,var(--ink3),var(--ink2));box-shadow:4px 4px 0 var(--bd);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.bookstrip .bs-ic{font-size:26px}.bookstrip .bs-t{flex:1;min-width:0}
.bookstrip b{display:block;font:700 16px var(--fd);letter-spacing:.5px}
.bookstrip small{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.bookstrip.writing{animation:p 1.4s infinite;border-color:var(--gold)}
.bk-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.bk-actions .act{flex:1;min-width:150px}
.bk-actions .act[disabled]{opacity:.45;cursor:not-allowed}
.bk-msg{margin:10px 0;padding:10px 14px;border:2px solid var(--gold);border-radius:10px;background:#ffffff0a;font-size:14px}
.perm{margin:14px 0;border:3px solid #000;border-radius:12px;background:var(--ink2);box-shadow:4px 4px 0 var(--bd);padding:12px 14px}
.perm h3{margin:0 0 4px;font:700 17px var(--fd);letter-spacing:.5px}
.chap{position:relative;margin:18px 0;border:3px solid #000;border-radius:6px 16px 16px 6px;background:linear-gradient(90deg,#cfc3a8 0,#f4ecda 16px,#f4ecda 100%);color:#2a1d12;box-shadow:6px 6px 0 var(--red);overflow:hidden}
.chap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--blue);border-right:2px solid #000}
.chap.cur{background:linear-gradient(90deg,#3a2a5a 0,var(--ink3) 16px,var(--ink2) 100%);color:var(--fg);border-style:dashed}
.chap-top{display:block;width:100%;padding:14px 16px 12px 24px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.chap-n{font:600 12px system-ui,sans-serif;letter-spacing:4px;color:#8a6a3a}
.chap.cur .chap-n{color:var(--gold)}
.chap-t{font:italic 700 24px/1.2 Georgia,"Times New Roman",serif;margin:2px 0 6px}
.chap-m{display:flex;flex-wrap:wrap;gap:6px;font:600 12px system-ui,sans-serif}
.chap-m span{padding:2px 9px;border:2px solid #00000033;border-radius:999px;background:#00000010}
.chap.cur .chap-m span{border-color:var(--bd);background:#ffffff0c}
.chap-r{margin-top:8px;font:15px/1.5 Georgia,serif;color:#5a4630}
.chap-b{padding:4px 18px 18px 26px;border-top:2px dashed #00000030}
.chap-b p{margin:0 0 12px;font:17px/1.75 Georgia,"Times New Roman",serif}
.chap-b p:first-of-type::first-letter{float:left;font:700 54px/.85 Georgia,serif;padding:6px 8px 0 0;color:var(--blue)}
.chap-b h4{margin:16px 0 4px;font:600 12px system-ui,sans-serif;letter-spacing:3px;color:#8a6a3a;text-transform:uppercase}
.chap-b ul{margin:0;padding-left:20px;font:15px/1.5 Georgia,serif}
.chap-b input,.chap-b textarea{background:#fffaf0;color:#2a1d12;border-color:#00000040}
.chap-b textarea{font:16px/1.6 Georgia,serif}
.chap-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

  return `Você é o narrador de um RPG de texto infinito de “Realidade Desejada” no universo Marvel (${c.era}). Use personagens, lugares e eventos reais do MCU e dos quadrinhos, com personalidade fiel. As decisões têm consequências reais: o mundo reage, relações mudam, riscos existem. Nunca decida pelo jogador nem fale por ele. A lore e o ponto de partida escritos pelo jogador mandam sobre o canon oficial. Na primeira cena (sem últimos turnos) comece exatamente no PONTO DE PARTIDA abaixo; se não foi informado, abra num momento comum da vida do personagem e deixe o mundo Marvel aparecer aos poucos.

NATURALIDADE DAS FALAS (regra mais importante):
- Fale como gente de verdade falaria no Brasil (ou como o personagem canônico falaria, no caso de heróis e vilões da Marvel): frases curtas, informais, com hesitação, interrupções, "ah", "tipo", "sei lá", "hm", conforme a idade e o jeito de cada um. Reticências com moderação.
- Quem acabou de se conhecer é educado, tímido, desconfiado ou indiferente. NINGUÉM abre o coração, elogia demais, flerta, faz declaração, revela segredo ou diz que "sente uma conexão" logo de cara. Intimidade só cresce com tempo e convivência: respeite os números de afeto, confiança e proximidade da seção RELAÇÕES.
- Nada de fala de filme, frase de efeito, discurso ou exposição. Ninguém explica o que sente ("estou nervosa porque…"). Emoção aparece no subtexto, no gesto, no silêncio, em mudar de assunto.
- Cada fala tem 1 a 2 frases curtas (no máximo 3 em momento de tensão). Não repita o nome de quem ouve a cada frase. Não repita o que o jogador acabou de dizer. Reaja ao que foi dito de verdade, inclusive com estranheza, tédio ou mal-entendido.
- Conversa banal é ótima: aula, comida, trânsito, celular, família, música, piada boba. O ritmo da história é lento e cotidiano; NÃO force acontecimentos grandes, revelações nem reviravoltas a cada cena, e não termine toda cena com gancho dramático.
- Exemplo ruim: "Você é diferente de todos que já conheci. Sinto que podemos confiar um no outro." Exemplo bom: "Ah… você também tá esperando o 485? Esse ônibus nunca passa."
- A narração é curta, concreta e sensorial: mostre em vez de explicar, sem excesso de adjetivos.
- As opções "say" do jogador também precisam soar naturais: curtas, do jeito que alguém da idade dele falaria de verdade, sem frase pronta e sem parecer saber mais do que sabe.

SEGREDO DOS PODERES:
- Os poderes do jogador (${c.poderes.join(", ")||"nenhum"}) são informação ESCONDIDA, só do narrador. Consciência atual do personagem do jogador: ${aw.r}

- NENHUMA fala, narração ou opção pode insinuar poderes se o personagem do jogador ainda não sabe deles. Só inclua opções de usar poder quando a consciência for "ciente" ou "domina".
- Os poderes só aparecem quando a história justificar e de forma gradual. Revelar poder em público tem consequências realistas (medo, curiosidade, interesse de organizações).

FORMATO DA CENA: use de 3 a 7 blocos. Bloco "nar" = narração em segunda pessoa, em português do Brasil, 1 a 3 frases curtas. Bloco "say" = fala de um personagem, com o nome em "who" e a fala em "x", SEM travessão e SEM aspas. TODA fala vai em bloco "say", nunca dentro da narração. Alterne narração e falas como num quadrinho.

LINGUAGEM E REALISMO: as falas são de gente real, no jeito de cada pessoa. Quando combinar com o momento e com quem fala (raiva, briga, intimidade, gíria de jovem), use palavrão e xingamento brasileiro natural, sem exagerar e sem censura artificial; quem é educado ou tímido não xinga do nada. Temas adultos (violência, medo, desejo, ciúme, dor) podem ser tratados com crueza e realismo. Cenas de sexo nunca são descritas de forma explícita: vale tensão, flerte e sugestão, e a cena corta. Nada sexual envolvendo menores de 18 anos, em nenhuma hipótese.

PERSONAGENS NOVOS: se aparecer alguém importante que ainda não tem nome definido, descreva só a aparência e o jeito na narração, use "who":"???" se ele falar, NÃO invente nome, e preencha "newchar" com uma frase curta dizendo quem apareceu (ex.: "uma garota de moletom roxo perto da fonte"). O jogador vai dar nome, idade, personalidade e a relação com o personagem dele. Personagens já definidos pelo jogador devem usar exatamente esses dados. Heróis e vilões conhecidos da Marvel não precisam disso: use o nome deles. Se VOCÊ mesmo der nome a alguém (com idade e jeito), deixe "newchar" como null: o site só abre a tela de criação para quem ficou sem nome. Quando abrir, o jogador define só o que você deixou em aberto.

RELAÇÕES (vêm do painel do jogador, que pode editá-las a qualquer momento: o painel MANDA):

  if(MIC.btn){MIC.btn.classList.remove("on");MIC.btn.textContent="🎤";MIC.btn.title="Ditar com a voz"}if(MIC.st)MIC.st.classList.remove("on");MIC.btn=MIC.ta=MIC.st=null}
function micJoin(base,t){if(!t)return base;var sep=base&&!/\s$/.test(base)?" ":"";if(!base.trim()||/[.!?…]\s*$/.test(base))t=t.charAt(0).toUpperCase()+t.slice(1);return base+sep+t}
function micStart(ta,btn,st){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Este navegador não tem reconhecimento de voz. Use o Chrome, o Edge ou o Safari para ditar.");return}
  micStop();var base=ta.value,idle=0;MIC.on=true;MIC.btn=btn;MIC.ta=ta;MIC.st=st;
  btn.classList.add("on");btn.textContent="⏹";btn.title="Parar";st.textContent="🎙️ Ouvindo… fale agora. Toque no botão para parar.";st.classList.add("on");
  function put(v){ta.value=v;try{ta.dispatchEvent(new Event("input",{bubbles:true}))}catch(e){}ta.scrollTop=ta.scrollHeight}
  function run(){var r=new SR();MIC.rec=r;r.lang="pt-BR";r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
    r.onresult=function(e){if(!document.body.contains(ta)){micStop();return}var fin="",tmp="";
      for(var i=e.resultIndex;i<e.results.length;i++){var t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else tmp+=t}
      idle=0;if(fin.trim()){base=micJoin(base,fin.trim());put(base)}else if(tmp.trim())put(micJoin(base,tmp.trim()))};
    r.onerror=function(e){var c=e&&e.error;if(c==="no-speech"||c==="aborted")return;
      if(c==="not-allowed"||c==="service-not-allowed"){micStop();alert("O microfone está bloqueado. Libere o acesso ao microfone nas permissões do navegador e tente de novo.")}
      else if(c==="audio-capture"){micStop();alert("Não encontrei nenhum microfone neste aparelho.")}
      else if(c==="network"){micStop();alert("O ditado precisa de internet. Verifique sua conexão e tente de novo.")}};
    r.onend=function(){if(!MIC.on||MIC.rec!==r)return;if(!document.body.contains(ta)){micStop();return}
      if(++idle>3){micStop();return}setTimeout(function(){if(MIC.on&&MIC.rec===r){try{run()}catch(e){micStop()}}},120)};
    try{r.start()}catch(e){micStop()}}
  run()}
